name: Georgian Painter Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
      timezone: "Asia/Tbilisi"

permissions:
  contents: write

concurrency:
  group: georgian-painter-hourly
  cancel-in-progress: false

jobs:
  collect:
    # Wikimedia Commons consistently rate-limits GitHub-hosted shared IPs.
    # Run from the owner's Windows self-hosted runner instead.
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Collect one painter
        id: collect
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path output | Out-Null
          python src/collector.py
          if ($LASTEXITCODE -ne 0) {
            throw "Collector exited with code $LASTEXITCODE"
          }

          $zip = Get-ChildItem -Path output -Filter *.zip |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if (-not $zip -or $zip.Length -le 0) {
            throw "Collector did not create a non-empty ZIP archive."
          }

          "zip_path=$($zip.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip_name=$($zip.BaseName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.zip_name }}
          path: ${{ steps.collect.outputs.zip_path }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Persist successful painter history
        shell: pwsh
        run: |
          git diff --quiet -- state/history.json
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No history change."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/history.json
          git commit -m "chore: record successful painter run"
          git push
